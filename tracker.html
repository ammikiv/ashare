<script>
(function(){
  var DATA=null;
  function pct(v){
    if(v===null||v===undefined) return '<span class="muted">—</span>';
    var cls=v>0?'up':'down';
    return '<span class="'+cls+'">'+(v>0?'+':'')+Number(v).toFixed(1)+'%</span>';
  }
  function pctN(v){ if(v===null||v===undefined) return '—'; return (v>0?'+':'')+Number(v).toFixed(1)+'%'; }
  function listBadges(lists){
    return (lists||[]).map(function(l){
      if(l==='Jev深析首屏') return '<span class="badge badge-first">Jev深析首屏</span>';
      if(l==='持续跟踪') return '<span class="badge badge-keep">持续跟踪</span>';
      return '<span class="badge">'+l+'</span>';
    }).join('');
  }
  function groupBy(rows,key){
    var m={}; (rows||[]).forEach(function(r){ (m[r[key]]=m[r[key]]||[]).push(r); }); return m;
  }

  function kpi(label,value,cls){ return '<div class="stat"><div class="label">'+label+
    '</div><div class="value '+(cls||'')+'">'+value+'</div></div>'; }

  function renderDashboard(){
    var s=DATA.summary, el=document.getElementById('kpis'), ws=document.getElementById('winstats');
    el.innerHTML=
      kpi('累计名单锚点',s.total_signals)+
      kpi('跟踪中',s.active,'up')+
      kpi('已到期',s.matured)+
      kpi('锚日无价',s.no_price,'muted')+
      kpi('T+5 平均',s.avg_ret5===null?'—':pctN(s.avg_ret5), s.avg_ret5>0?'up':'down')+
      kpi('T+20 平均',s.avg_ret20===null?'—':pctN(s.avg_ret20), s.avg_ret20>0?'up':'down');
    if(s.n_win20===0){
      ws.innerHTML='<div class="empty">尚无锚点走完 20 交易日窗口（最早锚日 '+
        DATA.rows[0].d0+'）；命中率/极值在窗口到期后自动出现，未到期不计、不按 0 算。</div>';
    } else {
      ws.innerHTML='<div class="grid">'+
        kpi('窗口样本',s.n_win20)+
        kpi('+5% 命中率',s.hit5_rate===null?'—':s.hit5_rate+'%','up')+
        kpi('+10% 命中率',s.hit10_rate===null?'—':s.hit10_rate+'%','up')+
        '</div>';
    }
    var g=groupBy(DATA.rows,'d0'), days=Object.keys(g).sort().slice(-5).reverse();
    document.getElementById('recent').innerHTML=days.map(function(d){
      var rs=g[d];
      return '<div style="margin-bottom:12px"><b>'+d+'</b> <span class="note">('+rs.length+' 只)</span>'+
        '<div style="margin-top:4px">'+rs.map(function(r){return listBadges(r.lists)+(r.name||r.code);}).join(' ')+
        '</div></div>';
    }).join('')||'<div class="empty">暂无记录</div>';
  }

  function renderDaily(){
    var g=groupBy(DATA.rows,'d0'), days=Object.keys(g).sort().reverse();
    document.getElementById('daily').innerHTML=days.map(function(d){
      var rs=g[d].sort(function(a,b){return a.code<b.code?-1:1;});
      return '<div class="dayhead"><b>'+d+'</b><span class="note">'+rs.length+' 只</span></div>'+
        '<table><thead><tr><th>代码</th><th>名称</th><th>行业</th><th>名单</th><th class="num">锚定价</th></tr></thead><tbody>'+
        rs.map(function(r){return '<tr><td>'+r.code+'</td><td><b>'+(r.name||'—')+'</b></td><td class="note">'+
          (r.industry||'—')+'</td><td>'+listBadges(r.lists)+'</td><td class="num">'+(r.c0===null?'—':r.c0)+'</td></tr>';}).join('')+
        '</tbody></table>';
    }).join('');
  }

  function renderTracking(){
    var rs=DATA.rows.filter(function(r){return r.status==='active';})
                    .sort(function(a,b){
                      return (b.cur_ret===null?-999:b.cur_ret)-(a.cur_ret===null?-999:a.cur_ret);});
    document.getElementById('track-count').textContent=rs.length;
    document.getElementById('tracking').innerHTML=rs.map(function(r){
      return '<tr><td>'+r.d0+'</td><td>'+r.code+'</td><td><b>'+(r.name||'—')+'</b></td>'+
        '<td>'+listBadges(r.lists)+'</td><td class="num">'+(r.c0===null?'—':r.c0)+'</td>'+
        '<td class="num">'+pct(r.cur_ret)+'</td><td class="num">'+(r.days_held===null?'—':r.days_held)+'</td>'+
        '<td class="num">'+pct(r.ret['5'])+'</td><td class="num">'+pct(r.ret['20'])+'</td></tr>';
    }).join('')||'<tr><td colspan="9" class="empty">暂无跟踪中</td></tr>';
  }

  function renderReview(){
    var s=DATA.summary, hs=document.getElementById('hitstats');
    if(s.n_win20===0){
      hs.innerHTML='<div class="empty">命中率样本未到期（需锚点走完 20 交易日）；以下分层在到期后自动填充。</div>';
    } else {
      var rows=Object.keys(s.by_list).map(function(ln){
        var d=s.by_list[ln];
        return '<tr><td>'+ln+'</td><td class="num">'+d.n+'</td><td class="num">'+
          (d.hit5_rate===null?'—':d.hit5_rate+'%')+'</td><td class="num">'+pct(d.avg_ret20)+'</td></tr>';
      }).join('');
      hs.innerHTML='<div class="grid">'+
        kpi('窗口样本',s.n_win20)+
        kpi('+5% 命中率',s.hit5_rate===null?'—':s.hit5_rate+'%','up')+
        kpi('+10% 命中率',s.hit10_rate===null?'—':s.hit10_rate+'%','up')+
        kpi('T+20 平均',s.avg_ret20===null?'—':pctN(s.avg_ret20),s.avg_ret20>0?'up':'down')+
        '</div><table><thead><tr><th>名单</th><th class="num">样本</th><th class="num">+5%命中</th><th class="num">T+20平均</th></tr></thead><tbody>'+rows+'</tbody></table>';
    }
    var ms=DATA.rows.filter(function(r){return r.status==='matured';})
                    .sort(function(a,b){return a.d0<b.d0?-1:1;});
    document.getElementById('matured-count').textContent=ms.length;
    document.getElementById('matured').innerHTML=ms.map(function(r){
      var w=r.win20||{};
      return '<tr><td>'+r.d0+'</td><td>'+r.code+'</td><td><b>'+(r.name||'—')+'</b></td>'+
        '<td>'+listBadges(r.lists)+'</td><td class="num">'+r.c0+'</td>'+
        '<td class="num">'+pct(r.ret['20'])+'</td><td class="num">'+pct(r.ret['60'])+'</td>'+
        '<td class="num">'+pct(w.max_gain)+'</td><td class="num">'+pct(w.max_dd)+'</td></tr>';
    }).join('')||'<tr><td colspan="9" class="empty">暂无到期档案（最早锚日未满 60 交易日）</td></tr>';
  }

  function showTab(t){
    document.querySelectorAll('.nav button').forEach(function(b){
      b.classList.toggle('active',b.dataset.tab===t);});
    ['dashboard','daily','tracking','review'].forEach(function(t2){
      document.getElementById('tab-'+t2).classList.toggle('hidden',t2!==t);});
    if(t==='dashboard') renderDashboard();
    if(t==='daily') renderDaily();
    if(t==='tracking') renderTracking();
    if(t==='review') renderReview();
  }
  document.querySelectorAll('.nav button').forEach(function(b){
    b.onclick=function(){showTab(b.dataset.tab);};
  });

  function applyData(){
    var s=DATA.summary;
    document.getElementById('meta').textContent=
      '运行 '+DATA.run_tag+' · 交易日历至 '+DATA.calendar.last+' · 锚点 '+s.total_signals+
      '（跟踪中 '+s.active+' / 到期 '+s.matured+'）· 每日收盘后自动复盘';
    renderDashboard();
  }
  async function load(){
    if(window.__TRACKER_REVIEW__){ DATA=window.__TRACKER_REVIEW__; applyData(); return; }
    try{
      var idx=await (await fetch('./api/tracker_review/tracker_review_index.json')).json();
      DATA=await (await fetch('./api/tracker_review/review_'+idx.latest+'.json')).json();
      applyData();
    }catch(e){
      document.getElementById('meta').textContent='复盘数据载入失败：'+e.message+
        '（本地请打开构建生成的自包含 tracker.html；http 站点需 api/tracker_review 可访问）';
    }
  }
  load();
})();
</script>
</body>
</html>
