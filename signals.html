/* ---- 表头 ---- */
function thead(){
  let g = `<tr><th rowspan="2" style="min-width:70px">代码</th><th rowspan="2">名称</th>

    <th rowspan="2"><button class="sort" data-k="s">信号数</button></th>`;
  D.classes.forEach(c => g += `<th class="grp" colspan="${c.sigs.length}"
      style="color:${clsColor[c.key]}">${c.label}</th>`);
  g += `<th rowspan="2">命中类别</th></tr><tr>`;
  D.classes.forEach(c => c.sigs.forEach(k =>
    g += `<th title="${esc(sigByKey[k].desc)}">${sigByKey[k].label}<br><span style="font-weight:400;color:var(--mut)">${sigByKey[k].n}</span></th>`));
  document.getElementById('thead').innerHTML = g + `</tr>`;
}

/* ---- 过滤 + 排序 + 渲染 ---- */
let sortKey = null;
const sel = () => [...document.querySelectorAll('#clsFilters input:checked')].map(i => i.value);
function rows(){
  const q = document.getElementById('q').value.trim();
  const scope = document.querySelector('input[name=scope]:checked').value;
  const cls = sel();
  let rs = D.stocks.filter(x =>
    (scope === 'all' || x.r === 1) &&
    (!q || x.c.includes(q) || x.n.includes(q)) &&
    cls.every(c => x.cl.includes(c)));
  if (sortKey) rs = rs.slice().sort((a,b) => b[sortKey]-a[sortKey] || a.c.localeCompare(b.c));
  return rs;
}
function cell(ch, x, key){
  const s = sigByKey[key];
  if (ch === '1'){
    const v = x.v && x.v[key];
    const t = v ? '：' + Object.entries(v).slice(0,4).map(([k,val]) => `${k}=${val}`).join(' ') : '';
    return `<td class="up" title="${esc(s.label)}${esc(t)}">✓</td>`;
  }
  if (ch === '0') return `<td class="no" title="${esc(s.label)}：未命中">✗</td>`;
  const why = x.rs && x.rs[key] ? '：' + x.rs[key] : '：数据不足（未判定，不计入未命中）';
  return `<td class="na" title="${esc(s.label)}${esc(why)}">—</td>`;
}
function render(){
  const rs = rows();
  document.getElementById('count').textContent = `显示 ${rs.length} 只`;
  const tb = document.getElementById('tbody');
  tb.innerHTML = rs.map(x => {
    const code = `<a href="https://stockpage.10jqka.com.cn/${x.c}/" target="_blank">${x.c}</a>`;
    const name = `<a href="https://xueqiu.com/S/${exch(x.c)}${x.c}" target="_blank">${esc(x.n)}</a>`;
    let m = '';
    for (let i = 0; i < x.st.length; i++) m += cell(x.st[i], x, D.signals[i].key);
    const cl = x.cl.length ? x.cl.map(c => `<span style="color:${clsColor[c]}">${esc((D.classes.find(y=>y.key===c)||{}).label||c)}</span>`).join('·') : '<span class="na">—</span>';
    return `<tr class="${x.r ? 'res' : ''}"><td class="l">${code}</td><td class="l">${name}</td>
      <td class="ind">${esc(x.ind)}</td><td class="k">${x.k}</td><td>${x.s}</td>${m}<td class="ind">${cl}</td></tr>`;
  }).join('');
}
document.getElementById('clsFilters').innerHTML =
  D.classes.map(c => `<label style="margin-right:8px"><input type="checkbox" value="${c.key}" checked>

document.querySelectorAll('#clsFilters input').forEach(i => i.onchange = render);
document.querySelectorAll('input[name=scope]').forEach(i => i.onchange = render);
document.getElementById('q').oninput = render;
document.querySelectorAll('button.sort').forEach(b => b.onclick = () => {

});

   + Object.entries(D.inputs).map(([k,v]) => `${k} <code>${v.file_md5.slice(0,8)}…</code>`).join('、')
